<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Commerce Agent</title>
    <style>
      :root {
        --bg: #0f1115;
        --panel: #171a21;
        --text: #e6e8ee;
        --muted: #9aa3b2;
        --accent: #6ea8fe;
        --line: #262b36;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        background: var(--bg);
        color: var(--text);
        height: 100vh;
        display: flex;
        flex-direction: column;
      }
      header {
        padding: 14px 20px;
        border-bottom: 1px solid var(--line);
        display: flex;
        align-items: baseline;
        gap: 12px;
      }
      header h1 { font-size: 16px; margin: 0; }
      header .tag { color: var(--muted); font-size: 12px; }
      #messages {
        flex: 1;
        overflow-y: auto;
        padding: 20px;
        display: flex;
        flex-direction: column;
        gap: 14px;
      }
      .msg { max-width: 760px; }
      .msg.user { align-self: flex-end; }
      .bubble {
        padding: 10px 14px;
        border-radius: 12px;
        background: var(--panel);
        border: 1px solid var(--line);
        white-space: pre-wrap;
      }
      .msg.user .bubble { background: #1d2b4a; border-color: #274072; }
      .meta { color: var(--muted); font-size: 12px; margin-bottom: 4px; }
      .tool {
        font-size: 12px;
        color: var(--muted);
        border-left: 2px solid var(--accent);
        padding: 2px 0 2px 8px;
        margin-top: 6px;
      }
      .card {
        margin-top: 8px;
        border: 1px solid var(--line);
        border-radius: 10px;
        overflow: hidden;
      }
      .card .row {
        display: flex;
        justify-content: space-between;
        padding: 8px 12px;
        border-bottom: 1px solid var(--line);
      }
      .card .row:last-child { border-bottom: none; }
      .card .price { color: var(--accent); }
      .oos { color: var(--muted); font-size: 12px; }
      footer {
        border-top: 1px solid var(--line);
        padding: 12px 20px;
        display: flex;
        gap: 10px;
      }
      input {
        flex: 1;
        background: var(--panel);
        border: 1px solid var(--line);
        color: var(--text);
        border-radius: 10px;
        padding: 10px 12px;
        font: inherit;
      }
      button {
        background: var(--accent);
        color: #0b1020;
        border: none;
        border-radius: 10px;
        padding: 10px 18px;
        font: inherit;
        font-weight: 600;
        cursor: pointer;
      }
      button:disabled { opacity: 0.5; cursor: default; }
    </style>
  </head>
  <body>
    <header>
      <h1>Commerce Agent</h1>
      <span class="tag">ACME storefront · spec-driven demo</span>
    </header>
    <div id="messages"></div>
    <footer>
      <input id="input" placeholder="Ask for something, e.g. a tent under $250" autocomplete="off" />
      <button id="send">Send</button>
    </footer>
    <script src="/static/app.js"></script>
  </body>
</html>
