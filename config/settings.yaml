# Commerce Agent configuration.
# Values here are overridable by environment variables (see .env.example).
# Misconfiguration fails loud at load (constitution PB-1).

llm:
  provider: deepseek        # deepseek | openai | anthropic | mock
  model: deepseek-chat
  base_url: https://api.deepseek.com
  api_key: ""               # set LLM_API_KEY in .env
  temperature: 0.0
  max_tokens: 4096
  # Fallback provider (feature 039, RD-1). Empty disables the fallback; set it to
  # a second provider/model to serve a turn when the primary fails before emitting.
  fallback_provider: ""      # "" (off) | deepseek | openai | anthropic | mock
  fallback_model: ""
  fallback_base_url: ""
  fallback_api_key: ""

agent:
  max_tool_iterations: 8
  max_turns: 24

embedding:
  provider: hash            # hash (keyless) | openai | ollama | mock
  model: text-embedding-3-small
  dimensions: 256
  base_url: ""
  api_key: ""

vector_store:
  provider: chroma          # chroma (persistent) | memory (keyless/test)
  persist_directory: ./data/chroma
  collection_name: knowledge

retrieval:
  dense_top_k: 20
  sparse_top_k: 20
  fusion_top_k: 10
  rrf_k: 60
  # RRF weights. Equal weights let the weaker leg drag the fusion down (measured:
  # val hit@10 0.983 at 1:1 vs 0.991 at 2:1), so the dense leg is down-weighted.
  sparse_weight: 2.0
  dense_weight: 1.0

rerank:
  enabled: false
  provider: none            # none | cross_encoder | llm
  top_k: 5

evaluation:
  enabled: false

observability:
  log_level: INFO
  trace_enabled: true
  trace_file: ./logs/traces.jsonl
  trace_max_attr_len: 500   # redact (truncate) span inputs/outputs (OB-5)

# Knowledge chunking: one chunk per markdown section (deep-linkable clause id), split
# further only past `chunk_size`, with the heading kept on every part.
ingestion:
  chunk_size: 1000

# Cross-session customer memory (feature 013). Facts are grounded in the
# customer's own text (P4) and recalled into later sessions through the log
# (SL-1). `memory` is the keyless demo path; `sqlite` persists.
memory:
  provider: sqlite          # memory | sqlite
  sqlite_path: ./data/db/memory.sqlite
  extraction: deterministic # deterministic (keyless)
  retention_days: 365

# Cost meter (constitution HR-12): records token usage per call, converts it to the
# configured currency, and reports the running total. Prices are USD per 1M tokens
# (conservative peak DeepSeek Flash). The in-app cap is OFF: HR-12 places the hard
# limit on the deployment, so the limit lives in the provider console. Set
# `enabled: true` together with `total_limit` to re-arm the in-app stop.
budget:
  enabled: false
  currency: CNY
  total_limit: 10.0
  usd_to_cny: 7.25
  input_cache_miss_per_1m: 0.30
  input_cache_hit_per_1m: 0.006
  output_per_1m: 1.20
  state_file: ./data/budget.json

web:
  host: 0.0.0.0
  port: 8000

# Storefront system of record (constitution PB-2). Only server-issued ids enter
# the session (P4). `memory` keeps the keyless demo path; `sqlite` persists.
storefront:
  provider: sqlite          # memory | sqlite
  sqlite_path: ./data/db/storefront.sqlite
  seed_orders: true         # seed demo orders per customer (keyless demo)

# Session log persistence (constitution SL-1). `memory` is the keyless path;
# `sqlite` lets conversations survive restarts and resume by id.
session:
  store: sqlite             # memory | sqlite
  sqlite_path: ./data/db/sessions.sqlite

# Local discovery retrieval (feature 046 step A). Live discovery searches a local
# index of the catalog (scripts/sync_catalog.py) instead of the shop's keyword
# search: measured hit@10 0.991 vs 0.920 at ~0.6 ms vs ~1360 ms. `hybrid` fuses
# the keyless lexical retriever with a real embedding (needs a real
# `embedding.provider`); `tfidf` stays keyless.
# Provider chosen by measurement, not taste: on the 216-case rule set the weighted
# hybrid only catches up to the lexical retriever (val hit@10 0.991 vs tfidf 0.991,
# full set 0.986 vs 0.991) while costing an embedding call per query, so the live
# path ships lexical. See reports/discovery-rrf-weights.md.
catalog:
  provider: tfidf           # tfidf (keyless, shipped) | hybrid (lexical + embedding, RRF)
  index_path: ./data/discovery/products.json
  collection_name: catalog
  overfetch: 4

# Knowledge retrieval (P4). Keyless lexical retriever over config/knowledge/.
knowledge:
  provider: dense           # dense (embeddings + Chroma) | memory (keyless TF-IDF)
  path: ./config/knowledge
  top_k: 3
  min_chars: 40

# Post-purchase returns (feature 014). This is the machine-readable return
# window; see config/policies/amazon.yaml (feature 046); the prose is derived. A return is a
# request only — the harness never refunds or changes the order (P3).
returns:
  window_days: 30

# Skills (feature 019): long-tail procedures in skills/<name>/SKILL.md. The
# system prompt lists their names/descriptions; use_skill loads a body on demand.
skills:
  enabled: true
  path: ./skills

# Boundary data quality (feature 027, RW-2). `repair` normalizes fixable values
# (e.g. "$1,299.00" -> 1299.00) and skips unusable rows; `strict` fails loud.
data:
  quality: repair           # repair | strict

# Shopify: the real post-purchase system of record (feature 045). Empty shop /
# token falls back to the keyless fixture backend. See docs/shopify-setup.md.
shopify:
  shop: ""                  # e.g. my-store.myshopify.com
  access_token: ""          # Admin API access token (start with read_orders)
  api_version: "2025-07"

# Input guard (feature 028, RW-1). A deterministic guard classifies the message
# before the model: injection attempts and oversized input are refused with a
# safe message, calling no tool. On by default.
safety:
  input_guard: true
  max_input_chars: 4000

# Graceful fallback (feature 031, RD-1). Dense retrieval degrades to the keyless
# lexical retriever when the embedding/vector store fails; set false to let the
# failure propagate.
resilience:
  fallback_enabled: true
