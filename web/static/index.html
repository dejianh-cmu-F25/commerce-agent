<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark light" />
    <title>Commerce Agent</title>
    <link rel="icon" href="/static/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/static/styles.css" />
  </head>
  <body>
    <header class="banner">
      <h1>Commerce Agent</h1>
      <span class="tag">ACME storefront · spec-driven demo</span>
      <span class="spacer"></span>
      <div class="budget" id="budget" title="Spend against the configured budget">
        <span id="budget-text">budget: —</span>
        <span class="bar" role="progressbar" aria-label="Budget used" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
          <span id="budget-fill"></span>
        </span>
      </div>
    </header>

    <main id="messages" class="messages" role="log" aria-live="polite" aria-relevant="additions text"></main>

    <button id="to-bottom" class="to-bottom" type="button" hidden>Scroll to bottom ↓</button>

    <footer class="composer">
      <div class="status" id="status" role="status"></div>
      <form class="inner" id="composer" autocomplete="off">
        <input
          id="input"
          type="text"
          placeholder="Ask for something, e.g. a tent under $250"
          autocomplete="off"
          spellcheck="false"
          aria-label="Message"
        />
        <button id="stop" type="button" hidden>Stop</button>
        <button id="send" type="submit">Send</button>
      </form>
    </footer>

    <script src="/static/vendor/marked.min.js"></script>
    <script src="/static/vendor/purify.min.js"></script>
    <script src="/static/app.js"></script>
  </body>
</html>
