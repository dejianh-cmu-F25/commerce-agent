# Commerce Agent configuration.
# Values here are overridable by environment variables (see .env.example).
# Misconfiguration fails loud at load (constitution PB-1).

llm:
  provider: deepseek        # deepseek | openai | anthropic | mock
  model: deepseek-chat
  base_url: https://api.deepseek.com
  api_key: ""               # set LLM_API_KEY in .env
  temperature: 0.0
  max_tokens: 4096

agent:
  max_tool_iterations: 8
  max_turns: 24

embedding:
  provider: hash            # hash (keyless) | openai | ollama | mock
  model: text-embedding-3-small
  dimensions: 256
  base_url: ""
  api_key: ""

vector_store:
  provider: chroma          # chroma (persistent) | memory (keyless/test)
  persist_directory: ./data/chroma
  collection_name: knowledge

retrieval:
  dense_top_k: 20
  sparse_top_k: 20
  fusion_top_k: 10
  rrf_k: 60

rerank:
  enabled: false
  provider: none            # none | cross_encoder | llm
  top_k: 5

evaluation:
  enabled: false
  provider: custom
  metrics: [hit_rate, mrr, faithfulness]

observability:
  log_level: INFO
  trace_enabled: true
  trace_file: ./logs/traces.jsonl
  trace_max_attr_len: 500   # redact (truncate) span inputs/outputs (OB-5)

ingestion:
  chunk_size: 1000
  chunk_overlap: 200
  splitter: recursive       # recursive | semantic | fixed
  chunk_refiner:
    use_llm: false
  metadata_enricher:
    use_llm: false

# Cross-session customer memory (feature 013). Facts are grounded in the
# customer's own text (P4) and recalled into later sessions through the log
# (SL-1). `memory` is the keyless demo path; `sqlite` persists.
memory:
  provider: sqlite          # memory | sqlite
  sqlite_path: ./data/db/memory.sqlite
  extraction: deterministic # deterministic (keyless)
  retention_days: 365

# Spend guard (constitution HR-12). Prices are USD per 1M tokens; the cap is CNY.
# Defaults use conservative (peak) DeepSeek Flash prices so we never overspend.
budget:
  enabled: true
  currency: CNY
  total_limit: 10.0
  usd_to_cny: 7.25
  input_cache_miss_per_1m: 0.30
  input_cache_hit_per_1m: 0.006
  output_per_1m: 1.20
  state_file: ./data/budget.json

web:
  host: 0.0.0.0
  port: 8000

# Storefront system of record (constitution PB-2). Only server-issued ids enter
# the session (P4). `memory` keeps the keyless demo path; `sqlite` persists.
storefront:
  provider: sqlite          # memory | sqlite
  sqlite_path: ./data/db/storefront.sqlite
  seed_orders: true         # seed demo orders per customer (keyless demo)

# Session log persistence (constitution SL-1). `memory` is the keyless path;
# `sqlite` lets conversations survive restarts and resume by id.
session:
  store: sqlite             # memory | sqlite
  sqlite_path: ./data/db/sessions.sqlite

# Knowledge retrieval (P4). Keyless lexical retriever over config/knowledge/.
knowledge:
  provider: dense           # dense (embeddings + Chroma) | memory (keyless TF-IDF)
  path: ./config/knowledge
  top_k: 3
  min_chars: 40

# Post-purchase returns (feature 014). This is the machine-readable return
# window; keep it in sync with config/knowledge/returns.md. A return is a
# request only — the harness never refunds or changes the order (P3).
returns:
  window_days: 30

# Skills (feature 019): long-tail procedures in skills/<name>/SKILL.md. The
# system prompt lists their names/descriptions; use_skill loads a body on demand.
skills:
  enabled: true
  path: ./skills
