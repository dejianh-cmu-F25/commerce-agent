name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  checks:
    name: lint + typecheck + tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --frozen

      - name: Lint
        run: uv run ruff check . && uv run ruff format --check .

      - name: Typecheck
        run: uv run pyright

      - name: Tests
        run: uv run pytest tests/unit tests/integration -q

      - name: Self-review (spec compliance)
        run: uv run python scripts/spec_review.py

  image:
    name: docker image build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t commerce-agent:ci .
